[project]
name = "Cetaceans-vs.-ships"
version = "0.1.0"
description = "Interface for the Cetaceans-vs.-ships"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["cetaceans_vs_ships"]
package-dir = { cetaceans_vs_ships = "." }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"